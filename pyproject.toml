[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lofnir"
version = "0.1.0"
description = "A code lifecycle tool for Python projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
lofnir = "lofnir.cli:app"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
