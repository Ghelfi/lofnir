[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lofnir"
version = "0.1.0"
description = "A code lifecycle tool for Python projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
lofnir = "lofnir.cli:app"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=9.0.3",
    "ruff>=0.4",
]
